<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 跑刀避雷指南</title>
  <meta name="description" content="个人中心 - 查看我的投稿、评论和收藏">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --bg: #141822;
      --bg-card: #191c2c;
      --border: #1e2030;
      --border-light: #252840;
      --text: #e0e0e0;
      --text-secondary: #8888aa;
      --text-muted: #666;
      --accent: #FF7D29;
      --blue: #165DFF;
      --safe: #2ECC71;
      --danger: #FF3B30;
      --warn: #FF9500;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; margin:0; }
    a { color: var(--accent); }
    a:hover { text-decoration: underline; }
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(20,22,34,0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-light);
    }
    .nav-links { display: flex; gap: 2px; }
    .nav-link {
      padding: 6px 14px; border-radius: 20px; font-size: 13px;
      color: rgba(255,255,255,0.55); font-weight: 500; transition: 0.2s;
    }
    .nav-link:hover { color: #fff; text-decoration: none; background: rgba(255,255,255,0.06); }
    .dashboard-wrap { max-width: 960px; margin: 0 auto; padding: 30px 20px; }
    .dash-header {
      background: linear-gradient(135deg, #0d0e1a 0%, #1a1c2c 100%);
      border-radius: 12px;
      padding: 28px 30px;
      border: 1px solid var(--border-light);
      margin-bottom: 24px;
    }
    .dash-welcome { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .dash-welcome small { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; }
    .dash-stats { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .dash-stat {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: 12px 18px;
      border-radius: 10px;
      text-align: center;
      min-width: 80px;
    }
    .dash-stat-num { display: block; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .dash-stat-label { font-size: 0.75rem; color: var(--text-secondary); }
    .dash-section { background: var(--bg-card); border-radius: 10px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-light); }
    .dash-section h3 { font-size: 1rem; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--text); }
    .dash-empty { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.9rem; line-height: 2; }
    .dash-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .dash-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .dash-table tr:last-child td { border-bottom: none; }
    .badge-sm { display: inline-block; font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
    .badge-danger { background: rgba(255,59,48,0.15); color: var(--danger); }
    .badge-warning { background: rgba(255,149,0,0.15); color: var(--warn); }
    .badge-safe { background: rgba(46,204,113,0.15); color: var(--safe); }
    .badge-pending { background: rgba(22,93,255,0.15); color: var(--blue); }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 18px;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-btn.active { border-color: var(--accent); background: rgba(255,125,41,0.12); color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .studio-link { color: var(--blue); text-decoration: none; font-weight: 600; }
    .studio-link:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .dash-header { padding: 20px; }
      .dash-stats { gap: 8px; }
      .dash-stat { min-width: 70px; padding: 8px 12px; }
      .dash-table { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;height:56px;">
      <a href="/" style="font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;">🔪 避雷指南</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link">🏠 首页</a>
        <a href="/list.html" class="nav-link">📋 黑名单</a>
        <span id="navLogin"></span>
      </div>
    </div>
  </nav>

  <div class="dashboard-wrap" id="dashApp">
    <!-- 头部 -->
    <div class="dash-header">
      <div class="dash-welcome" id="dashWelcome">加载中...</div>
      <div class="dash-stats" id="dashStats"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchDashTab('submissions', this)">📄 我的投稿</button>
      <button class="tab-btn" onclick="switchDashTab('comments', this)">💬 我的评论</button>
      <button class="tab-btn" onclick="switchDashTab('favorites', this)">⭐ 我的收藏</button>
    </div>

    <!-- 投稿 -->
    <div class="tab-content active" id="tab-submissions">
      <div class="dash-section">
        <h3>📄 我投稿的工作室</h3>
        <div id="dashSubmissions"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>

    <!-- 评论 -->
    <div class="tab-content" id="tab-comments">
      <div class="dash-section">
        <h3>💬 我的评论</h3>
        <div id="dashComments"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>

    <!-- 收藏 -->
    <div class="tab-content" id="tab-favorites">
      <div class="dash-section">
        <h3>⭐ 我收藏的工作室</h3>
        <div id="dashFavorites"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>跑刀避雷指南 · 纯绿玩家自建测评站</p>
      <p class="footer-small">数据来源于玩家投稿，仅供参考。接单前请自行判断。</p>
    </div>
  </footer>

  <script src="js/app.js?v=1779902031"></script>
  <script>
    var CURRENT_USER = null;

    // ===== Fetch current user =====
    async function loadUser() {
      try {
        var r = await fetch("/api/session");
        var d = await r.json();
        CURRENT_USER = d.user;
      } catch(e) { CURRENT_USER = null; }
      // 如果没登录，踢回首页
      if (!CURRENT_USER) { window.location.href = "/"; return; }
    }

    // ===== Init =====
    async function initDashboard() {
      await loadUser();
      if (!CURRENT_USER) return;
      
      // 更新导航栏
      updateNav();

      // 加载数据
      loadStats();
      loadSubmissions();
      loadComments();
      loadFavorites();
    }

    // ===== Stats =====
    async function loadStats() {
      document.getElementById("dashWelcome").innerHTML = "👋 欢迎回来，" + escHtml(CURRENT_USER) + "<br><small>这里是你的个人面板</small>";
      
      try {
        var r = await fetch("/api/dashboard/stats");
        var d = await r.json();
        var html = "";
        var items = [
          { num: d.submissions || 0, label: "投稿" },
          { num: d.comments || 0, label: "评论" },
          { num: d.favorites || 0, label: "收藏" }
        ];
        items.forEach(function(item) {
          html += '<div class="dash-stat"><span class="dash-stat-num">' + item.num + '</span><span class="dash-stat-label">' + item.label + '</span></div>';
        });
        document.getElementById("dashStats").innerHTML = html;
      } catch(e) {}
    }

    // ===== Submissions =====
    async function loadSubmissions() {
      var el = document.getElementById("dashSubmissions");
      try {
        var r = await fetch("/api/user/submissions");
        var d = await r.json();
        if (!d.submissions || d.submissions.length === 0) {
          el.innerHTML = '<p class="dash-empty">你还没有投过稿 😕<br><a href="submit.html" style="color:var(--blue);font-size:0.85rem;">去曝光一个工作室 →</a></p>';
          return;
        }
        var html = '<table class="dash-table">';
        d.submissions.forEach(function(s) {
          var riskLabel = {danger: '<span class="badge-sm badge-danger">🔴 黑</span>', warning: '<span class="badge-sm badge-warning">🟡 存疑</span>', safe: '<span class="badge-sm badge-safe">🟢 白</span>'};
          var statusLabel = s.status === "pending" ? '<span class="badge-sm badge-pending">待审核</span>' : '<span class="badge-sm badge-safe">已发布</span>';
          html += '<tr><td>' + escHtml(s.name) + '</td><td>' + (riskLabel[s.risk] || '') + '</td><td>' + statusLabel + '</td><td style="color:var(--text-muted);font-size:0.8rem;">' + (s.date || '') + '</td></tr>';
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Comments =====
    async function loadComments() {
      var el = document.getElementById("dashComments");
      try {
        var r = await fetch("/api/user/comments");
        var d = await r.json();
        if (!d.comments || d.comments.length === 0) {
          el.innerHTML = '<p class="dash-empty">你还没有评论过 😕<br><small style="color:var(--text-muted);">在工作室详情页面可以发表评论</small></p>';
          return;
        }
        var html = '<table class="dash-table">';
        d.comments.forEach(function(c) {
          html += '<tr><td><a href="/list.html#studio-' + escHtml(c.studio_id) + '" class="studio-link">' + escHtml(c.studio_name || c.studio_id) + '</a></td><td style="color:var(--text-secondary);">' + escHtml(c.content.substring(0, 40)) + (c.content.length > 40 ? '...' : '') + '</td><td style="color:var(--text-muted);font-size:0.8rem;">' + (c.date || '') + '</td></tr>';
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Favorites =====
    async function loadFavorites() {
      var el = document.getElementById("dashFavorites");
      try {
        var r = await fetch("/api/favorites");
        var d = await r.json();
        if (!d.favorites || d.favorites.length === 0) {
          el.innerHTML = '<p class="dash-empty">还没有收藏的工作室 😕<br><small style="color:var(--text-muted);">在列表页点击 ⭐ 即可收藏</small></p>';
          return;
        }
        // 加载工作室详情
        var sr = await fetch("/api/studios");
        var sd = await sr.json();
        var studioMap = {};
        (sd.studios || []).forEach(function(s) { studioMap[s.id] = s; });

        var html = '<table class="dash-table">';
        d.favorites.forEach(function(id) {
          var s = studioMap[id];
          if (s) {
            var riskLabel = {danger: '<span class="badge-sm badge-danger">🔴 黑</span>', warning: '<span class="badge-sm badge-warning">🟡 存疑</span>', safe: '<span class="badge-sm badge-safe">🟢 白</span>'};
            html += '<tr><td><a href="/list.html#studio-' + escHtml(s.id) + '" class="studio-link">' + escHtml(s.name) + '</a></td><td>' + (riskLabel[s.risk] || '') + '</td><td style="color:var(--text-muted);font-size:0.8rem;">' + escHtml(s.platform || '') + '</td></tr>';
          } else {
            html += '<tr><td style="color:var(--text-muted);">' + escHtml(id) + '</td></tr>';
          }
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Tab Switch =====
    function switchDashTab(tab, btn) {
      document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
      if (btn) btn.classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
    }

    // ===== Page Init =====
    document.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
