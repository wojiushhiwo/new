<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 跑刀避雷指南</title>
  <meta name="description" content="个人中心 - 查看我的投稿、评论和收藏">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dashboard-wrap { max-width: 960px; margin: 0 auto; padding: 30px 20px; }
    .dash-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 16px;
      padding: 30px;
      color: #fff;
      margin-bottom: 24px;
    }
    .dash-welcome { font-size: 1.4rem; font-weight: 700; }
    .dash-welcome small { font-size: 0.85rem; color: #a0a0b8; font-weight: 400; }
    .dash-stats { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .dash-stat {
      background: rgba(255,255,255,0.08);
      padding: 10px 16px;
      border-radius: 10px;
      text-align: center;
      min-width: 80px;
    }
    .dash-stat-num { display: block; font-size: 1.3rem; font-weight: 700; }
    .dash-stat-label { font-size: 0.75rem; color: #a0a0b8; }
    .dash-section { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; border: 1px solid #e8e8ef; }
    .dash-section h3 { font-size: 1rem; margin-bottom: 14px; color: #1a1a2e; }
    .dash-empty { text-align: center; padding: 30px 0; color: #8a8aaa; font-size: 0.9rem; }
    .dash-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .dash-table td { padding: 10px 6px; border-bottom: 1px solid #f0f0f5; vertical-align: middle; }
    .dash-table tr:last-child td { border-bottom: none; }
    .badge-sm { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .badge-danger { background: #fde8e8; color: #e74c3c; }
    .badge-warning { background: #fef7e0; color: #f39c12; }
    .badge-safe { background: #e8f8ed; color: #27ae60; }
    .badge-pending { background: #eef0ff; color: #4a6cf7; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 18px;
      border: 2px solid #d8d8e0;
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .tab-btn:hover { border-color: #4a6cf7; }
    .tab-btn.active { border-color: #4a6cf7; background: #4a6cf7; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .studio-link { color: #4a6cf7; text-decoration: none; }
    .studio-link:hover { text-decoration: underline; }
    .member-badge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
    .member-badge.member { background: #e8f8ed; color: #27ae60; }
    @media (max-width: 640px) {
      .dash-header { padding: 20px; }
      .dash-stats { gap: 8px; }
      .dash-stat { min-width: 70px; padding: 8px 12px; }
      .dash-table { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">
        <span class="logo-icon">🔪</span>
        <span class="logo-text">跑刀避雷指南</span>
      </div>
      <nav>
        <a href="/">首页</a>
        <span id="navLogin"></span>
        <a href="list.html">黑名单</a>
        <a href="list.html?platform=闲鱼">闲鱼</a>
        <a href="list.html?platform=抖音">抖音</a>
        <a href="list.html?platform=B站">B站</a>
      </nav>
    </div>
  </header>

  <div class="dashboard-wrap" id="dashApp">
    <!-- 头部 -->
    <div class="dash-header">
      <div class="dash-welcome" id="dashWelcome">加载中...</div>
      <div class="dash-stats" id="dashStats"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchDashTab('submissions', this)">📄 我的投稿</button>
      <button class="tab-btn" onclick="switchDashTab('comments', this)">💬 我的评论</button>
      <button class="tab-btn" onclick="switchDashTab('favorites', this)">⭐ 我的收藏</button>
    </div>

    <!-- 投稿 -->
    <div class="tab-content active" id="tab-submissions">
      <div class="dash-section">
        <h3>📄 我投稿的工作室</h3>
        <div id="dashSubmissions"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>

    <!-- 评论 -->
    <div class="tab-content" id="tab-comments">
      <div class="dash-section">
        <h3>💬 我的评论</h3>
        <div id="dashComments"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>

    <!-- 收藏 -->
    <div class="tab-content" id="tab-favorites">
      <div class="dash-section">
        <h3>⭐ 我收藏的工作室</h3>
        <div id="dashFavorites"><p class="dash-empty">加载中...</p></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>跑刀避雷指南 · 纯绿玩家自建测评站</p>
      <p class="footer-small">数据来源于玩家投稿，仅供参考。接单前请自行判断。</p>
    </div>
  </footer>

  <script src="js/app.js?v=1779902031"></script>
  <script>
    var CURRENT_USER = null;

    // ===== Fetch current user =====
    async function loadUser() {
      try {
        var r = await fetch("/api/session");
        var d = await r.json();
        CURRENT_USER = d.user;
      } catch(e) { CURRENT_USER = null; }
      // 如果没登录，踢回首页
      if (!CURRENT_USER) { window.location.href = "/"; return; }
    }

    // ===== Init =====
    async function initDashboard() {
      await loadUser();
      if (!CURRENT_USER) return;
      
      // 更新导航栏
      updateNav();

      // 加载数据
      loadStats();
      loadSubmissions();
      loadComments();
      loadFavorites();
    }

    // ===== Stats =====
    async function loadStats() {
      document.getElementById("dashWelcome").innerHTML = "👋 欢迎回来，" + escHtml(CURRENT_USER) + "<br><small>这里是你的个人面板</small>";
      
      try {
        var r = await fetch("/api/dashboard/stats");
        var d = await r.json();
        var html = "";
        var items = [
          { num: d.submissions || 0, label: "投稿" },
          { num: d.comments || 0, label: "评论" },
          { num: d.favorites || 0, label: "收藏" }
        ];
        items.forEach(function(item) {
          html += '<div class="dash-stat"><span class="dash-stat-num">' + item.num + '</span><span class="dash-stat-label">' + item.label + '</span></div>';
        });
        document.getElementById("dashStats").innerHTML = html;
      } catch(e) {}
    }

    // ===== Submissions =====
    async function loadSubmissions() {
      var el = document.getElementById("dashSubmissions");
      try {
        var r = await fetch("/api/user/submissions");
        var d = await r.json();
        if (!d.submissions || d.submissions.length === 0) {
          el.innerHTML = '<p class="dash-empty">你还没有投过稿 😕<br><a href="submit.html" style="color:#4a6cf7;font-size:0.85rem;">去曝光一个工作室 →</a></p>';
          return;
        }
        var html = '<table class="dash-table">';
        d.submissions.forEach(function(s) {
          var riskLabel = {danger: '<span class="badge-sm badge-danger">🔴 黑</span>', warning: '<span class="badge-sm badge-warning">🟡 存疑</span>', safe: '<span class="badge-sm badge-safe">🟢 白</span>'};
          var statusLabel = s.status === "pending" ? '<span class="badge-sm badge-pending">待审核</span>' : '<span class="badge-sm badge-safe">已发布</span>';
          html += '<tr><td>' + escHtml(s.name) + '</td><td>' + (riskLabel[s.risk] || '') + '</td><td>' + statusLabel + '</td><td style="color:#a0a0b8;font-size:0.8rem;">' + (s.date || '') + '</td></tr>';
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Comments =====
    async function loadComments() {
      var el = document.getElementById("dashComments");
      try {
        var r = await fetch("/api/user/comments");
        var d = await r.json();
        if (!d.comments || d.comments.length === 0) {
          el.innerHTML = '<p class="dash-empty">你还没有评论过 😕<br><small style="color:#a0a0b8;">在工作室详情页面可以发表评论</small></p>';
          return;
        }
        var html = '<table class="dash-table">';
        d.comments.forEach(function(c) {
          html += '<tr><td><a href="/list.html#studio-' + escHtml(c.studio_id) + '" class="studio-link">' + escHtml(c.studio_name || c.studio_id) + '</a></td><td style="color:#555;">' + escHtml(c.content.substring(0, 40)) + (c.content.length > 40 ? '...' : '') + '</td><td style="color:#a0a0b8;font-size:0.8rem;">' + (c.date || '') + '</td></tr>';
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Favorites =====
    async function loadFavorites() {
      var el = document.getElementById("dashFavorites");
      try {
        var r = await fetch("/api/favorites");
        var d = await r.json();
        if (!d.favorites || d.favorites.length === 0) {
          el.innerHTML = '<p class="dash-empty">还没有收藏的工作室 😕<br><small style="color:#a0a0b8;">在列表页点击 ⭐ 即可收藏</small></p>';
          return;
        }
        // 加载工作室详情
        var sr = await fetch("/api/studios");
        var sd = await sr.json();
        var studioMap = {};
        (sd.studios || []).forEach(function(s) { studioMap[s.id] = s; });

        var html = '<table class="dash-table">';
        d.favorites.forEach(function(id) {
          var s = studioMap[id];
          if (s) {
            var riskLabel = {danger: '<span class="badge-sm badge-danger">🔴 黑</span>', warning: '<span class="badge-sm badge-warning">🟡 存疑</span>', safe: '<span class="badge-sm badge-safe">🟢 白</span>'};
            html += '<tr><td><a href="/list.html#studio-' + escHtml(s.id) + '" class="studio-link">' + escHtml(s.name) + '</a></td><td>' + (riskLabel[s.risk] || '') + '</td><td style="color:#a0a0b8;font-size:0.8rem;">' + escHtml(s.platform || '') + '</td></tr>';
          } else {
            html += '<tr><td style="color:#a0a0b8;">' + escHtml(id) + '</td></tr>';
          }
        });
        html += '</table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<p class="dash-empty">加载失败</p>'; }
    }

    // ===== Tab Switch =====
    function switchDashTab(tab, btn) {
      document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
      if (btn) btn.classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
    }

    // ===== Page Init =====
    document.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
