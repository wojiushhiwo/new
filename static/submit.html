<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曝光投稿 · 跑刀避雷指南 | 防坑曝光</title>
  <meta name="description" content="匿名投稿曝光三角洲跑刀工作室，被骗了就来这里发帖，帮兄弟们避雷。">
  <meta name="keywords" content="三角洲行动,曝光工作室,跑刀被骗,举报护航">
  <meta property="og:title" content="曝光投稿 · 跑刀避雷指南">
  <meta property="og:description" content="匿名投稿曝光三角洲工作室，帮兄弟们避雷。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bileizhinan.top/submit.html">
  <link rel="canonical" href="https://bileizhinan.top/submit.html">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <link rel="stylesheet" href="css/style.css?v=1779902000">
</head>
<body>
  <header class="header">
    <div class="container">
      
            <nav>
        <a href="/">首页</a>
        <a href="submit.html" class="active">曝光投稿</a>
        <span id="navLogin"></span>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>📢 曝光投稿</h1>
      <p>被坑了？发现骗子工作室？来这里曝光，帮兄弟避雷。匿名投稿，无需登录。</p>
    </div>
  </section>

  <section class="form-section">
    <div class="container">
      <form id="reportForm" class="report-form">
        <div class="form-group">
          <label for="studioName">工作室/店铺名称 *</label>
          <input type="text" id="studioName" required placeholder="比如：xxx工作室、xxx店铺">
        </div>

        <div class="form-group">
          <label for="platform">交易平台</label>
          <select id="platform">
            <option value="闲鱼">闲鱼</option>
            <option value="QQ">QQ</option>
            <option value="微信">微信</option>
            <option value="B站">B站</option>
            <option value="贴吧">贴吧</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="contact">对方联系方式（闲鱼ID/QQ号/微信号）</label>
          <input type="text" id="contact" placeholder="选填，方便别人搜到">
        </div>

        <div class="form-group">
          <label>风险评级 *</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="risk" value="danger" checked> 🔴 高危（跑路/骗押金）
            </label>
            <label class="radio-label">
              <input type="radio" name="risk" value="warning"> 🟡 存疑（服务差/慢）
            </label>
            <label class="radio-label">
              <input type="radio" name="risk" value="safe"> 🟢 推荐（靠谱实测）
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="detail">详细经过 *</label>
          <textarea id="detail" rows="6" required placeholder="什么时间、什么情况、怎么被坑的、金额多少...写越详细越能帮到别人"></textarea>
        </div>

        <div class="form-group">
          <label for="contactBack">你的联系方式（选填）</label>
          <input type="text" id="contactBack" placeholder="QQ/微信/闲鱼ID，方便我们核实细节">
          <p class="form-hint">不会被公开，仅管理员用于核实信息</p>
        </div>

        <button type="submit" class="btn-submit">提交曝光</button>
      </form>
      <div id="submitSuccess" class="submit-success" style="display:none">
        <h2>✅ 投稿已收到</h2>
        <p>感谢你的曝光，审核通过后会尽快录入黑名单。</p>
        <a href="/" class="btn-back">返回首页</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>跑刀避雷指南 · 纯绿玩家自建测评站</p>
      <p class="footer-small">数据来源于玩家投稿，仅供参考。接单前请自行判断。</p>
    </div>
  </footer>

  
  <script src="js/app.js?v=1779902000"></script>
<script>
function showToast(msg, isError) {
  var t = document.createElement("div");
  t.style.cssText = "position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:"+(isError?"#3a1a1a":"#191c2c")+";border:1px solid "+(isError?"rgba(255,59,48,0.3)":"#252840")+";color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:99999;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:opacity 0.3s;";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; setTimeout(function(){ t.remove(); },300); }, 3000);
}
(function(){
  var form = document.getElementById("reportForm");
  var success = document.getElementById("submitSuccess");
  if (!form) return;

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    var name = document.getElementById("studioName").value.trim();
    var platform = document.getElementById("platform").value;
    var contact = document.getElementById("contact").value.trim();
    var detail = document.getElementById("detail").value.trim();
    var contactBack = document.getElementById("contactBack").value.trim();

    // Get selected risk
    var risk = "warning";
    var radios = document.getElementsByName("risk");
    for (var i = 0; i < radios.length; i++) {
      if (radios[i].checked) { risk = radios[i].value; break; }
    }

    if (!name) { showToast("❌ 请填写工作室名称", true); return; }
    if (!detail) { showToast("❌ 请填写详细经过", true); return; }

    var btn = form.querySelector(".btn-submit");
    btn.disabled = true;
    btn.textContent = "提交中...";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/report", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onload = function() {
      btn.disabled = false;
      btn.textContent = "提交曝光";
      if (xhr.status === 200) {
        form.style.display = "none";
        success.style.display = "block";
      } else {
        try {
          var d = JSON.parse(xhr.responseText);
          showToast("❌ " + (d.error || "提交失败，请稍后重试"), true);
        } catch(e) {
          showToast("❌ 提交失败，请稍后重试", true);
        }
      }
    };
    xhr.onerror = function() {
      btn.disabled = false;
      btn.textContent = "提交曝光";
      showToast("❌ 网络错误，请稍后重试", true);
    };
    xhr.send(JSON.stringify({
      name: name,
      platform: platform,
      contact: contact,
      risk: risk,
      detail: detail,
      contact_back: contactBack
    }));
  });
})();
</script>
</body>
</html>
