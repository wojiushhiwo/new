<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 跑刀避雷指南</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 32px 28px;
      width: 400px;
      max-width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon { font-size: 2.8rem; display: block; margin-bottom: 6px; }
    .logo-text { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    .logo-sub { font-size: 0.8rem; color: rgba(255,255,255,0.45); margin-top: 4px; display: block; }

    .tabs { display: flex; gap: 0; margin-bottom: 24px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 3px; }
    .tab {
      flex: 1; text-align: center; padding: 10px 0; border-radius: 10px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: all 0.2s; color: rgba(255,255,255,0.5);
    }
    .tab.active { background: rgba(74,108,247,0.25); color: #fff; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px;
      background: rgba(255,255,255,0.05); color: #fff;
      font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--primary, #4a6cf7); }
    .form-group input::placeholder { color: rgba(255,255,255,0.25); }
    .form-group input.code-input {
      letter-spacing: 3px; font-size: 1.1rem; text-transform: uppercase;
    }

    .btn-submit {
      width: 100%; padding: 12px;
      background: var(--primary, #4a6cf7); color: #fff;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg {
      background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 14px; font-size: 0.85rem; display: none;
    }
    .error-msg.show { display: block; }

    .success-msg {
      background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3);
      color: #27ae60; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 14px; font-size: 0.85rem; display: none;
    }
    .success-msg.show { display: block; }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .footer { text-align: center; margin-top: 18px; font-size: 0.75rem; color: rgba(255,255,255,0.3); }
    .invite-hint {
      font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-top: 4px;
    }

    .back-link {
      display: inline-block; margin-bottom: 16px;
      color: rgba(255,255,255,0.4); font-size: 0.8rem; text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary, #4a6cf7); }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="back-link">← 返回首页</a>

    <div class="logo">
      <span class="logo-icon" id="loginLogo">🔪</span>
      <div class="logo-text" id="loginSiteName">跑刀避雷指南</div>
      <span class="logo-sub" id="loginSubtitle">三角洲工作室红黑榜</span>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabRegister" onclick="switchTab('register')">注册</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Login -->
    <div class="form-panel active" id="panelLogin">
      <form method="post" action="/login">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" name="username" placeholder="输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" placeholder="输入密码" required>
        </div>
        <button type="submit" class="btn-submit">登 录</button>
      </form>
    </div>

    <!-- Register -->
    <div class="form-panel" id="panelRegister">
      <form method="post" action="/register" onsubmit="return validateRegister(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regName" name="username" placeholder="设置你的用户名" required>
        </div>
        <div class="form-group">
          <label>邀请码</label>
          <input type="text" id="regInvite" name="invite" class="code-input" placeholder="输入邀请码" maxlength="20" required>
          <div class="invite-hint">需凭邀请码注册，请联系管理员获取</div>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPwd" name="password" placeholder="至少4位" required>
        </div>
        <button type="submit" class="btn-submit" id="regSubmitBtn">注 册</button>
      </form>
    </div>

    <div class="footer">注册即登录 · 纯绿玩家自建测评站</div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.form-panel').forEach(function(p){ p.classList.remove('active'); });
      document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
      document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    function validateRegister(e) {
      var name = document.getElementById('regName').value.trim();
      var invite = document.getElementById('regInvite').value.trim();
      var pwd = document.getElementById('regPwd').value.trim();
      var errEl = document.getElementById('errorMsg');

      if (!name) {
        e.preventDefault();
        errEl.textContent = '❌ 请输入用户名';
        errEl.classList.add('show');
        return false;
      }
      if (!invite) {
        e.preventDefault();
        errEl.textContent = '❌ 请输入邀请码';
        errEl.classList.add('show');
        return false;
      }
      if (name.length < 2) {
        e.preventDefault();
        errEl.textContent = '❌ 用户名至少2位';
        errEl.classList.add('show');
        return false;
      }
      if (pwd.length < 4) {
        e.preventDefault();
        errEl.textContent = '❌ 密码至少4位';
        errEl.classList.add('show');
        return false;
      }
      return true;
    }

    // 错误提示
    var url = new URL(window.location.href);
    var err = url.searchParams.get('error');
    var errEl = document.getElementById('errorMsg');
    var errMsgs = {
      '1': '❌ 用户名或密码错误',
      '2': '❌ 请填写完整信息',
      '3': '❌ 该用户名已被注册',
      '4': '❌ 格式不正确',
      '6': '❌ 邀请码无效或已被使用'
    };
    if (err && errMsgs[err]) {
      errEl.textContent = errMsgs[err];
      errEl.classList.add('show');
      if (err === '2' || err === '3' || err === '6') switchTab('register');
    }

    // 邀请码大写自动转换
    document.addEventListener('DOMContentLoaded', function(){
      var inviteInput = document.getElementById('regInvite');
      if (inviteInput) {
        inviteInput.addEventListener('input', function(){
          this.value = this.value.toUpperCase();
        });
      }
    });

    // 加载动态设置
    fetch('/api/settings').then(function(r){ return r.json(); }).then(function(s){
      if (!s || !s.site_name) return;
      document.title = '登录 · ' + s.site_name;
      document.getElementById('loginLogo').textContent = s.logo_emoji || '🔪';
      document.getElementById('loginSiteName').textContent = s.site_name;
      document.getElementById('loginSubtitle').textContent = (s.hero_title || '三角洲跑刀工作室') + ' ' + (s.hero_highlight || '红黑榜');
      if (s.primary_color) {
        document.documentElement.style.setProperty('--primary', s.primary_color);
      }
    }).catch(function(e){ console.error('Settings load failed', e); });
  </script>
</body>
</html>
